<main class="account-deletion-page container"><section class="account-deletion-intro"><span class="section-kicker" id="kicker">خصوصية المستخدم</span><h1 id="pageTitle">طلب حذف الحساب</h1><p id="pageIntro">استخدم النموذج لإرسال طلب حذف حسابك والبيانات المرتبطة به. سنراجع الطلب ونتواصل معك عند الحاجة.</p></section><form id="deletionForm" class="deletion-form"><div class="deletion-grid"><label><span id="emailLabel">البريد الإلكتروني للحساب</span><input id="email" type="email" required></label><label><span id="accountIdLabel">معرّف الحساب أو UID</span><input id="accountId" required></label><label><span id="appNameLabel">اسم التطبيق أو المنتج</span><input id="appName" required></label><label><span id="reasonLabel">سبب طلب الحذف</span><textarea id="reason" rows="4" required></textarea></label><label class="wide"><span id="notesLabel">ملاحظات إضافية (اختياري)</span><textarea id="notes" rows="4"></textarea></label></div><label class="deletion-confirm"><input id="confirm" type="checkbox" required><span id="confirmText">أؤكد أن هذا الطلب صادر عن صاحب الحساب أو من يمثله رسميًا.</span></label><button class="button button-primary" type="submit" id="submitButton">إرسال طلب الحذف <span>↗</span></button><p class="form-message" id="formMessage" role="status"></p></form><section class="deletion-success" id="successBox" hidden><span>✓</span><h2 id="successTitle">تم استلام طلبك</h2><p id="successText"></p></section></main>
